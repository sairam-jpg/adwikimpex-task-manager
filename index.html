<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adwik Impex | Office Tasks</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#172033;font-family:Arial,sans-serif}
header{background:#142b46;color:white;padding:22px}
header h2{margin:0 0 6px}
main{max-width:850px;margin:22px auto;padding:16px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 10px #0000000c}
input,select,button{width:100%;padding:13px;margin:7px 0;border:1px solid #ccd3dc;border-radius:8px;font-size:15px}
button{background:#1769aa;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#526477}
.task{border:1px solid #e0e5eb;border-radius:10px;padding:14px;margin:12px 0}
.task h3{margin:0 0 8px;overflow-wrap:anywhere}
.meta{font-size:13px;color:#667085;line-height:1.7}
.status{font-weight:bold;color:#1769aa}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:bold}
.stage-pending{background:#fff4cc;color:#8a5a00}
.stage-progress{background:#dbeafe;color:#1d4ed8}
.stage-completed{background:#dcfce7;color:#166534}
.stage-hold{background:#e5e7eb;color:#374151}
.stage-overdue{background:#fee2e2;color:#b91c1c}
.priority-normal{background:#dcfce7;color:#166534}
.priority-high{background:#ffedd5;color:#9a3412}
.priority-urgent{background:#fee2e2;color:#b91c1c}
.task.overdue{border:2px solid #dc2626;background:#fffafa}
.task.completed{opacity:.82}
.hidden{display:none}
.row{display:flex;gap:10px;align-items:center}
.row button{width:auto}
#message{color:#b42318;font-size:14px}
@media(max-width:500px){main{padding:10px}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
<h2>Adwik Impex</h2>
<div>Office Task Management</div>
</header>

<main>
<section id="login" class="card">
<h2>Welcome to Office Tasks</h2>
<p>Sign in using your company Google account.</p>
<button onclick="login()">Sign in with Google</button>
<p id="message"></p>
</section>

<section id="app" class="hidden">
<div class="card">
<div class="row">
<div style="flex:1">
<h3>Office Dashboard</h3>
<div id="userEmail" class="meta"></div>
</div>
<button class="secondary" onclick="logout()">Sign out</button>
</div>
</div>

<div class="card">
<h3>+ Create a Task</h3>
<form id="taskForm">
<label>Task title</label>
<input id="title" maxlength="140" required placeholder="What needs to be done?">

<label>Assign to company email</label>
<input id="assignee" type="email" required
placeholder="employee@adwikimpex.com">

<label>Deadline date</label>
<input id="dueDate" type="date" required>

<label>Deadline time</label>
<input id="dueTime" type="time" required>

<label>Priority</label>
<select id="priority">
<option>Normal</option>
<option>High</option>
<option>Urgent</option>
</select>
<button type="submit">Create Task</button>
</form>
<p id="taskMessage"></p>
</div>

<div class="card">
<h3>All Office Tasks</h3>
<div id="taskSummary" class="meta"></div>

<label>Completion stage</label>
<select id="filter" onchange="renderTasks()">
<option value="All">All tasks</option>
<option>Pending</option>
<option>In Progress</option>
<option>Completed</option>
</select>

<label>Deadline view</label>
<select id="dateFilter" onchange="renderTasks()">
<option value="All">All dates</option>
<option value="Today">Today</option>
<option value="Tomorrow">Tomorrow</option>
<option value="Upcoming">Upcoming</option>
<option value="Overdue">Overdue</option>
<option value="NoDeadline">No deadline</option>
</select>

<label>Priority filter</label>
<select id="priorityFilter" onchange="renderTasks()">
<option value="All">All priorities</option>
<option>Normal</option>
<option>High</option>
<option>Urgent</option>
</select>

<label>Filter by assignee email</label>
<input id="employeeFilter" type="email" placeholder="Enter employee email" oninput="renderTasks()">

<div id="taskList">Loading tasks...</div>
</div>
</section>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCdWiE0DEK6iaVLArSndVFtb4AmyabpXUw",
  authDomain: "adwikimpex-task-manager.firebaseapp.com",
  projectId: "adwikimpex-task-manager",
  storageBucket: "adwikimpex-task-manager.firebasestorage.app",
  messagingSenderId: "1049216214773",
  appId: "1:1049216214773:web:e3475dbf9dc38ab1a987bc",
  measurementId: "G-X5E8T35VP8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

// Default deadline date to today; choose the actual time.
const today = new Date();
const todayLocal = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
document.getElementById("dueDate").value = todayLocal;

provider.setCustomParameters({ prompt: "select_account" });

let currentUser = null;
let tasks = [];
let unsubscribe = null;
let authReady = false;

const loginSection = document.getElementById("login");
const appSection = document.getElementById("app");
const loginButton = loginSection.querySelector("button");
const loginMessage = document.getElementById("message");

function showLoginMessage(message) {
  loginMessage.textContent = message || "";
}

function isCompanyAccount(user) {
  return !!(user && user.email &&
    user.email.toLowerCase().endsWith("@adwikimpex.com"));
}

async function login() {
  if (!authReady) {
    showLoginMessage("Please wait. Authentication is initializing...");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Opening Google sign-in...";
  showLoginMessage("");

  try {
    await auth.signInWithPopup(provider);
  } catch (error) {
    console.error("Google sign-in error:", error);
    const redirectFallbackCodes = [
      "auth/popup-blocked",
      "auth/operation-not-supported-in-this-environment"
    ];

    if (redirectFallbackCodes.includes(error.code)) {
      try {
        await auth.signInWithRedirect(provider);
        return;
      } catch (redirectError) {
        console.error("Google redirect sign-in error:", redirectError);
        showLoginMessage(getFriendlyAuthError(redirectError));
      }
    } else {
      showLoginMessage(getFriendlyAuthError(error));
    }
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "Sign in with Google";
  }
}

function getFriendlyAuthError(error) {
  const messages = {
    "auth/unauthorized-domain":
      "This website domain is not authorized in Firebase Authentication. Add sairam-jpg.github.io under Firebase Authentication > Settings > Authorized domains.",
    "auth/popup-closed-by-user":
      "The Google sign-in window was closed before sign-in completed.",
    "auth/cancelled-popup-request":
      "A sign-in window is already open. Complete that sign-in first.",
    "auth/network-request-failed":
      "Network error. Check your internet connection and try again.",
    "auth/account-exists-with-different-credential":
      "An account already exists with this email using a different sign-in method."
  };

  return messages[error.code] ||
    ("Google sign-in failed: " + (error.message || error.code || "Unknown error"));
}

async function logout() {
  try {
    await auth.signOut();
  } catch (error) {
    alert("Sign-out failed: " + error.message);
  }
}

(async function initializeAuthentication() {
  try {
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    try {
      await auth.getRedirectResult();
    } catch (error) {
      console.error("Redirect result error:", error);
      showLoginMessage(getFriendlyAuthError(error));
    }
  } catch (error) {
    console.error("Authentication initialization error:", error);
    showLoginMessage(getFriendlyAuthError(error));
  } finally {
    authReady = true;
    loginButton.disabled = false;
    loginButton.textContent = "Sign in with Google";
  }
})();

auth.onAuthStateChanged(user => {
  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }

  currentUser = user;

  if (isCompanyAccount(user)) {
    loginSection.classList.add("hidden");
    appSection.classList.remove("hidden");
    document.getElementById("userEmail").textContent = user.email;
    showLoginMessage("");
    listenTasks();
  } else {
    appSection.classList.add("hidden");
    loginSection.classList.remove("hidden");

    if (user) {
      showLoginMessage(
        "Access denied. Please sign in using your @adwikimpex.com company account."
      );
      auth.signOut().catch(error => console.error("Sign-out error:", error));
    }
  }
});

function listenTasks() {
  unsubscribe = db.collection("tasks").onSnapshot(snapshot => {
    tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    tasks.sort((a, b) => {
      const x = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      const y = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return y - x;
    });
    renderTasks();
  }, error => {
    document.getElementById("taskList").textContent =
      "Unable to load tasks: " + error.message;
  });
}
  document.getElementById("taskForm").addEventListener("submit", async e => {
  e.preventDefault();

  const msg = document.getElementById("taskMessage");
  const title = document.getElementById("title").value.trim();
  const email = document.getElementById("assignee").value.trim().toLowerCase();
  const priority = document.getElementById("priority").value;
  const dueDate = document.getElementById("dueDate").value;
  const dueTime = document.getElementById("dueTime").value;

  msg.style.color = "#b42318";

  if (!currentUser || !isCompanyAccount(currentUser)) {
    msg.textContent = "Please sign in with your company account first.";
    return;
  }

  if (!email.endsWith("@adwikimpex.com")) {
    msg.textContent = "Please enter a valid @adwikimpex.com company email.";
    return;
  }

  if (!dueDate || !dueTime) {
    msg.textContent = "Please select both a deadline date and time.";
    return;
  }

  const dueAt = new Date(dueDate + "T" + dueTime + ":00");
  if (Number.isNaN(dueAt.getTime())) {
    msg.textContent = "Please enter a valid deadline.";
    return;
  }

  try {
    await db.collection("tasks").add({
      title: title,
      assigneeEmail: email,
      createdBy: currentUser.email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      dueAt: firebase.firestore.Timestamp.fromDate(dueAt),
      dueDateText: dueDate,
      dueTimeText: dueTime,
      deadlineHistory: [],
      reminderSentForDueAt: null,
      status: "Pending",
      priority: priority
    });

    e.target.reset();
    msg.style.color = "green";
    msg.textContent = "Task created successfully!";
  } catch (error) {
    msg.style.color = "#b42318";
    msg.textContent = error.message;
  }
});

function toDate(value) {
  if (!value) return null;
  if (value.toDate) return value.toDate();
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();
}

function stageClass(status) {
  return ({
    "Pending": "stage-pending",
    "In Progress": "stage-progress",
    "Completed": "stage-completed",
    "On Hold": "stage-hold"
  })[status] || "stage-pending";
}

function priorityClass(priority) {
  return ({
    "Normal": "priority-normal",
    "High": "priority-high",
    "Urgent": "priority-urgent"
  })[priority] || "priority-normal";
}

function isOverdue(task) {
  const due = toDate(task.dueAt);
  return !!(due && task.status !== "Completed" && due.getTime() < Date.now());
}

function formatDateTime(value) {
  const d = toDate(value);
  return d ? d.toLocaleString("en-IN", {
    day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  }) : "Not set";
}
  function renderTasks() {
  const list = document.getElementById("taskList");
  const stageFilter = document.getElementById("filter").value;
  const dateFilter = document.getElementById("dateFilter").value;
  const priorityFilter = document.getElementById("priorityFilter").value;
  const employeeFilter = document.getElementById("employeeFilter").value.trim().toLowerCase();
  const now = new Date();
  const tomorrow = new Date(now);
  tomorrow.setDate(now.getDate() + 1);

  const visible = tasks.filter(t => {
    const due = toDate(t.dueAt);
    if (stageFilter !== "All" && (t.status || "Pending") !== stageFilter) return false;
    if (priorityFilter !== "All" && (t.priority || "Normal") !== priorityFilter) return false;
    if (employeeFilter && !(t.assigneeEmail || "").toLowerCase().includes(employeeFilter)) return false;

    if (dateFilter === "NoDeadline" && due) return false;
    if (dateFilter === "Today" && !(due && isSameDay(due, now))) return false;
    if (dateFilter === "Tomorrow" && !(due && isSameDay(due, tomorrow))) return false;
    if (dateFilter === "Upcoming" && !(due && due > new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) && !isOverdue(t))) return false;
    if (dateFilter === "Overdue" && !isOverdue(t)) return false;
    return true;
  });

  const pending = tasks.filter(t => (t.status || "Pending") !== "Completed").length;
  const completed = tasks.filter(t => t.status === "Completed").length;
  const overdue = tasks.filter(isOverdue).length;
  document.getElementById("taskSummary").textContent =
    `Total: ${tasks.length} | Active: ${pending} | Completed: ${completed} | Overdue: ${overdue}`;

  list.innerHTML = "";
  if (!visible.length) {
    list.textContent = "No tasks found for these filters.";
    return;
  }

  visible.forEach(t => {
    const overdue = isOverdue(t);
    const card = document.createElement("div");
    card.className = "task" + (overdue ? " overdue" : "") +
      (t.status === "Completed" ? " completed" : "");

    const title = document.createElement("h3");
    title.textContent = t.title || "Untitled task";

    const badges = document.createElement("div");
    badges.className = "badges";
    const stage = document.createElement("span");
    stage.className = "tag " + stageClass(t.status || "Pending");
    stage.textContent = t.status || "Pending";
    const priority = document.createElement("span");
    priority.className = "tag " + priorityClass(t.priority || "Normal");
    priority.textContent = (t.priority || "Normal") + " priority";
    badges.append(stage, priority);

    if (overdue) {
      const overdueTag = document.createElement("span");
      overdueTag.className = "tag stage-overdue";
      overdueTag.textContent = "OVERDUE";
      badges.appendChild(overdueTag);
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent =
      "Assigned to: " + (t.assigneeEmail || "") +
      " | Created by: " + (t.createdBy || "") +
      " | Created: " + formatDateTime(t.createdAt) +
      " | Deadline: " + formatDateTime(t.dueAt);

    const history = document.createElement("div");
    history.className = "meta";
    const historyItems = Array.isArray(t.deadlineHistory) ? t.deadlineHistory : [];
    if (historyItems.length) {
      history.textContent = "Deadline extended " + historyItems.length +
        " time(s). Latest change: " + formatDateTime(historyItems[historyItems.length - 1].changedAt);
    }
    const statusLabel = document.createElement("label");
    statusLabel.textContent = "Update completion stage";
    const select = document.createElement("select");
    ["Pending", "In Progress", "Completed"].forEach(s => {
      const option = document.createElement("option");
      option.value = s;
      option.textContent = s;
      option.selected = (t.status || "Pending") === s;
      select.appendChild(option);
    });

    const button = document.createElement("button");
    button.textContent = "Update Status";
    button.onclick = () => updateStatus(t.id, select.value, button);

    card.append(title, badges, meta, history, statusLabel, select, button);

    if (currentUser && t.createdBy &&
        currentUser.email.toLowerCase() === t.createdBy.toLowerCase() &&
        t.status !== "Completed") {
      const extend = document.createElement("button");
      extend.className = "secondary";
      extend.textContent = "Extend Deadline";
      extend.onclick = () => extendDeadline(t);
      card.appendChild(extend);
    }

    if (historyItems.length) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "View deadline extension history";
      const historyList = document.createElement("div");
      historyList.className = "meta";
      historyItems.forEach(item => {
        const line = document.createElement("p");
        line.textContent =
          `${formatDateTime(item.oldDueAt)} → ${formatDateTime(item.newDueAt)} | By: ${item.changedBy || "Unknown"} | Reason: ${item.reason || "Not provided"}`;
        historyList.appendChild(line);
      });
      details.append(summary, historyList);
      card.appendChild(details);
    }

    list.appendChild(card);
  });
}

async function extendDeadline(task) {
  if (!currentUser || !task.createdBy ||
      currentUser.email.toLowerCase() !== task.createdBy.toLowerCase()) {
    alert("Only the person who created this task can extend its deadline.");
    return;
  }

  const currentDue = toDate(task.dueAt);
  const dateDefault = currentDue
    ? `${currentDue.getFullYear()}-${String(currentDue.getMonth()+1).padStart(2,"0")}-${String(currentDue.getDate()).padStart(2,"0")}`
    : "";
  const timeDefault = currentDue
    ? `${String(currentDue.getHours()).padStart(2,"0")}:${String(currentDue.getMinutes()).padStart(2,"0")}`
    : "17:00";

  const newDate = prompt("Enter the new deadline date (YYYY-MM-DD):", dateDefault);
  if (!newDate) return;
  const newTime = prompt("Enter the new deadline time (HH:MM, 24-hour):", timeDefault);
  if (!newTime) return;
  const reason = prompt("Reason for extending the deadline:");
  if (reason === null) return;

  const nextDue = new Date(`${newDate}T${newTime}:00`);
  if (Number.isNaN(nextDue.getTime()) || (currentDue && nextDue <= currentDue)) {
    alert("Please enter a valid deadline later than the current deadline.");
    return;
  }
  try {
    const oldDueAt = task.dueAt || null;
    const historyEntry = {
      oldDueAt: oldDueAt,
      newDueAt: firebase.firestore.Timestamp.fromDate(nextDue),
      changedBy: currentUser.email,
      changedAt: firebase.firestore.Timestamp.now(),
      reason: reason.trim()
    };

    await db.collection("tasks").doc(task.id).update({
      dueAt: firebase.firestore.Timestamp.fromDate(nextDue),
      dueDateText: newDate,
      dueTimeText: newTime,
      deadlineHistory: firebase.firestore.FieldValue.arrayUnion(historyEntry),
      reminderSentForDueAt: null,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert("Deadline extended. The task deadline has been updated.");
  } catch (error) {
    alert("Deadline extension failed: " + error.message +
      "\\nIf Firestore rules reject this update, we must update the rules to authorize the task creator only.");
  }
}

async function updateStatus(id, status, button) {
  button.disabled = true;
  try {
    await db.collection("tasks").doc(id).update({
      status: status,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      completedAt: status === "Completed"
        ? firebase.firestore.FieldValue.serverTimestamp()
        : null
    });
  } catch (error) {
    alert("Update failed: " + error.message);
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
